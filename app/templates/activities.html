{% extends 'base.html' %}

{% block title %}Activities - Garmin Activity Tracker{% endblock %}

{% block content %}
<div class="activities-page">
    <div class="page-header">
        <h1>Activities</h1>
        <a href="/upload" class="btn btn-primary">Upload Activity</a>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group">
            <label for="sport-filter">Sport</label>
            <select id="sport-filter">
                <option value="">All Sports</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="year-filter">Year</label>
            <select id="year-filter">
                <option value="">All Years</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="month-filter">Month</label>
            <select id="month-filter">
                <option value="">All Months</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>
        <button class="btn btn-secondary" id="clear-filters">Clear Filters</button>
    </div>

    <!-- Activities List -->
    <div class="activities-container">
        <div class="activities-list" id="activities-list">
            <div class="loading">Loading activities...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/activities.js') }}"></script>
{% endblock %}
