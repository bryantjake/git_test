{% extends 'base.html' %}

{% block title %}Personal Records - Garmin Activity Tracker{% endblock %}

{% block content %}
<div class="records-page">
    <h1>Personal Records</h1>

    <!-- Sport Filter -->
    <div class="sport-tabs" id="sport-tabs">
        <button class="sport-tab active" data-sport="">All Sports</button>
        <!-- Populated by JS -->
    </div>

    <!-- Records Grid -->
    <div class="records-container" id="records-container">
        <div class="loading">Loading records...</div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/records.js') }}"></script>
{% endblock %}
