<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Garmin Activity Tracker{% endblock %}</title>

    <!-- Leaflet for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">Garmin Tracker</a>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.endpoint == 'main.index' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/activities" class="{% if request.endpoint == 'main.activities' %}active{% endif %}">Activities</a></li>
            <li><a href="/stats" class="{% if request.endpoint == 'main.stats' %}active{% endif %}">Stats</a></li>
            <li><a href="/records" class="{% if request.endpoint == 'main.records' %}active{% endif %}">Records</a></li>
            <li><a href="/compare" class="{% if request.endpoint == 'main.compare' %}active{% endif %}">Compare</a></li>
            <li><a href="/upload" class="{% if request.endpoint == 'main.upload' %}active{% endif %}">Upload</a></li>
            <li><a href="/settings" class="{% if request.endpoint == 'main.settings' %}active{% endif %}">Settings</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Garmin Activity Tracker - Your Personal Fitness Dashboard</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
