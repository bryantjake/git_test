<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NFL GeoGuessr{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">NFL GeoGuessr</a>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.endpoint == 'main.index' %}active{% endif %}">Home</a></li>
            <li><a href="/play" class="{% if request.endpoint == 'main.play' %}active{% endif %}">Play</a></li>
            <li><a href="/upload" class="{% if request.endpoint == 'main.upload' %}active{% endif %}">Upload Photos</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
